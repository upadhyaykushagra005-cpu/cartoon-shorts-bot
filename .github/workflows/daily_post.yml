name: Daily Cartoon Post

on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "30 13 * * *"  # 7:00 PM IST
  workflow_dispatch: # Manual trigger

jobs:
  post-cartoon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          VIDEO_HOST_BASE_URL: ${{ secrets.VIDEO_HOST_BASE_URL }}
        run: python main.py

      - name: Commit updated history
        run: |
          git config user.name "Cartoon Bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add posted_history.json
          git diff --cached --quiet || git commit -m "Update posted history"
          git push origin main
